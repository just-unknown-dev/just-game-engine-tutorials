name: my_game
description: "My Game, made with the Just Game Engine."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  # The Flutter the engine is made for. pub holds the game to it, so a plain
  # `flutter pub get` on another Flutter says so; `just upgrade` moves it.
  flutter: ">=3.47.1 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  # just_audio_engine registers a web plugin without depending on
  # flutter_web_plugins; depending on it here keeps web builds compiling.
  flutter_web_plugins:
    sdk: flutter
  just_game_engine: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The editor and the tools are dev dependencies: a release build leaves
  # out their native plugins, and only lib/main_editor.dart imports them.
  just_core_cli: ^0.2.0
  just_game_engine_cli: ^0.2.0
  just_asset_store: ^0.3.0
  just_game_engine_editor: ^0.1.0
  # For recording the episode's editor clips; not part of the finished project.
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/scenes/
    - assets/project/physics.json
    - assets/sprites/
