name: effects_basics
description: "Episode 16 of the Just Game Engine tutorials: particles, effects and post-processing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.1 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  # just_audio_engine registers a web plugin without depending on
  # flutter_web_plugins; depending on it here keeps web builds compiling.
  flutter_web_plugins:
    sdk: flutter
  just_game_engine: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # For filming the vignette as the real app; not part of the finished project.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
  shaders:
    - shaders/vignette.frag
